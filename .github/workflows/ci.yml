name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        working-directory: backend
        run: dotnet restore

      - name: Build
        working-directory: backend
        run: dotnet build --no-restore

      - name: Run tests
        working-directory: backend
        run: dotnet test --no-build

  frontend:
    name: Frontend (web and mobile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Lint web
        working-directory: web/yumgo-web
        run: bun run lint

      - name: Build web
        working-directory: web/yumgo-web
        run: bun run build

      - name: Type-check mobile
        working-directory: mobile/yumgo-mobile
        run: bunx tsc --noEmit

      - name: Lint mobile
        working-directory: mobile/yumgo-mobile
        run: bun run lint

      - name: Check Expo project
        working-directory: mobile/yumgo-mobile
        run: bunx expo-doctor

services:
  postgres:
    image: postgres:17-alpine
    container_name: yumgo-postgres
    environment:
      POSTGRES_DB: yumgo
      POSTGRES_USER: yumgo
      POSTGRES_PASSWORD: yumgo_dev_password
    ports:
      - "5432:5432"
    volumes:
      - yumgo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yumgo -d yumgo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: yumgo-redis
    ports:
      - "6379:6379"
    volumes:
      - yumgo_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  yumgo_postgres_data:
  yumgo_redis_data:
